name: claude-review

# Runs only on PRs labelled "claude-review", to control API cost.
# Setup: in Claude Code run /install-github-app, or add the ANTHROPIC_API_KEY repository secret.

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for kritvo-web (the Kritvo UI). The PR branch is checked out.
            Use CLAUDE.md as the standard. The design docs live in the private kritvo-api repository and are not checked out here;
            rely on CLAUDE.md and the PR description for design context (HLD/LLD
            sections are named there).

            Focus on, in order: security (XSS, token handling, secrets in VITE_ variables),
            tenant_id never sent from the client, offline outbox and idempotency, correctness,
            accessibility and 48 px tap targets, Hindi and English strings, performance, tests, and
            hand-written API types (generated types must be used).

            Post one top-level comment with `gh pr comment` containing:
            1. Verdict: ✅ Good to go / ⚠️ Needs changes / ❌ Significant issues
            2. A findings table: # | Severity (🔴 Critical, 🟠 Major, 🟡 Minor, 🔵 Nit) | Location | Category | Issue | Suggested fix
            3. Documentation impact, if any.
            Use inline comments for specific lines. Only post GitHub comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
